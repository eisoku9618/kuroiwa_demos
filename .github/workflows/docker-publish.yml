name: Build and push Docker image

on:
  push:
    branches: ["master"]
    paths:
      - "docker/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: eisoku9618

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: codex-workspace
            tag: ubuntu24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.image.name }}
          file: docker/${{ matrix.image.name }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image.name }}:${{ matrix.image.tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image.name }}:latest
      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: eisoku9618/${{ matrix.image.name }}
          readme-filepath: docker/${{ matrix.image.name }}/README.md
          short-description: Codex workspace image built from GitHub Actions
